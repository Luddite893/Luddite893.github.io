0.4" width="174" height="11.7"><div xmlns="http://www.w3.org/1999/xhtml" class="rm-note">左右に置いた組織は、それぞれ別の分類に属する。札の左端の色がその分類を示す（前付「分類について」の色と同じ）。中央の組織については、その組織が持つ関係をすべてこの一枚に載せている。左右の組織の関係は、その組織の属する分類の図に出る。</div></foreignObject><rect x="0" y="135.1" width="174" height="13" rx="0.8" fill="none" stroke="#5c5a54" stroke-width="0.2" opacity="0.55"/><text x="3" y="140.1" font-size="2.3" fill="#5c5a54" letter-spacing="0.14">関係の語</text><text x="3" y="144.5" font-size="1.85" fill="#8b8880">札の中に記す</text><path d="M 26 139.5 L 35 139.5" stroke="#1b1b1a" stroke-width="0.55" fill="none" stroke-linejoin="round"/><text x="26" y="143.5" font-size="2.35" fill="#1b1b1a">敵対</text><text x="26" y="146.5" font-size="1.9" fill="#8b8880">交戦している</text><path d="M 54.8 139.5 L 63.8 139.5" stroke="#1b1b1a" stroke-width="0.4" fill="none" stroke-linejoin="round"/><text x="54.8" y="143.5" font-size="2.35" fill="#1b1b1a">同盟</text><text x="54.8" y="146.5" font-size="1.9" fill="#8b8880">結んでいる</text><path d="M 83.6 139.5 L 92.6 139.5" stroke="#1b1b1a" stroke-width="0.4" fill="none" stroke-linejoin="round"/><g transform="translate(92.60 139.50) rotate(0)"><path d="M -1.9 -1.5 L 0.9 0 L -1.9 1.5 Z" fill="#1b1b1a"/></g><text x="83.6" y="143.5" font-size="2.35" fill="#1b1b1a">従属</text><text x="83.6" y="146.5" font-size="1.9" fill="#8b8880">下位から上位へ</text><path d="M 112.4 139.5 L 121.4 139.5" stroke="#1b1b1a" stroke-width="0.4" fill="none" stroke-linejoin="round" stroke-dasharray="1.9 1.4"/><g transform="translate(121.40 139.50) rotate(0)"><path d="M -1.9 -1.5 L 0.9 0 L -1.9 1.5 Z" fill="#1b1b1a"/></g><text x="112.4" y="143.5" font-size="2.35" fill="#1b1b1a">派生</text><text x="112.4" y="146.5" font-size="1.9" fill="#8b8880">母体を指す</text><path d="M 141.2 139.5 L 150.2 139.5" stroke="#1b1b1a" stroke-width="0.4" fill="none" stroke-linejoin="round"/><text x="141.2" y="143.5" font-size="2.35" fill="#1b1b1a">反目</text><text x="141.2" y="146.5" font-size="1.9" fill="#8b8880">席を争うが交戦しない</text></svg>